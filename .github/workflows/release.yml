name: Release

# Build bundles for macOS + Windows + Linux and attach them to a GitHub Release
# whenever a v* tag is pushed. Also emits latest.json for the in-app updater.
# Linux emits .deb (for apt) and .AppImage on ubuntu-22.04 (older glibc =
# widest compatibility).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary so one .dmg runs on both Apple Silicon and Intel.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: '--bundles nsis'
          # Linux: .deb (apt) + .AppImage. 22.04 keeps glibc old for reach.
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign) — separate from code signing;
          # required so the in-app updater trusts the downloaded bundle.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Conduit ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below. Installers are unsigned — see the download page for the one-time click-through.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

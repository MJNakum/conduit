[package]
name = "ssh-client"
version = "0.1.0"
description = "Modern local-first SSH client for macOS"
authors = ["Meet Nakum"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker limitation, see https://github.com/rust-lang/cargo/issues/8519).
name = "ssh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.62.2"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "io-util"] }

[package]
name = "conduit"
version = "0.3.0"
description = "Modern local-first SSH client"
authors = ["Meet Nakum"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows
# linker limitation, see https://github.com/rust-lang/cargo/issues/8519).
name = "ssh_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.62.2"
# SFTP protocol client over a russh channel stream (decoupled from russh version).
russh-sftp = "2.3.0"
# Same ssh-key already pulled in transitively by russh; this edge only turns on
# the `getrandom` feature so we can seed in-app key generation (SysRng). Pinned
# to russh's exact version to avoid a duplicate copy in the tree.
ssh-key = { version = "=0.7.0-rc.11", features = ["getrandom"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "io-util", "sync"] }
# Cross-platform OS keychain (macOS Keychain / Windows Credential Manager).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# In-app auto-update: check a GitHub Releases endpoint, download + install a
# signed bundle, then relaunch. Referenced only under #[cfg(desktop)] in lib.rs.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Vault lock: Touch ID / macOS password via LocalAuthentication. Thin objc2
# framework binding; objc2/block2/objc2-foundation are already in the tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"

# Vault lock: Windows Hello via UserConsentVerifier. The HWND interop
# (RequestVerificationForWindowAsync) is needed because we're an unpackaged
# Win32 app with no CoreWindow to parent the prompt to.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
# IAsyncOperation lives in windows-future (split out of the windows facade, which
# only re-exports windows_core); needed to name the interop's async return type.
windows-future = "0.2"
